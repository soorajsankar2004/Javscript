<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .qbox {
            width: 80%;
            margin-left: 10%;
            background-color: bisque;
            height: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-radius: 10px;
        }

        .q {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5)50%, rgba(0, 0, 0, 0.5)50%);
            padding: 10px;
            border-radius: 10px;

        }

        .p {
            font-weight: bold;
            color: rgb(94, 23, 23);
        }
        #submit{
            width: 50%;
            margin-left: 25%;
            border-radius: 5px;
            border: 0px;
            background-color: orange;
            color: white;
            font-weight: bold;
            height: 30px;
        }
        #submit:hover
        {
            opacity: 50%;
        }
    </style>
    <script>
        function result()
        {
            let score = 0;
            var q1 = document.querySelector('input[name = "q1"]:checked');
            var q2 = document.querySelector('input[name = "q2"]:checked');
            var q3 = document.querySelector('input[name = "q3"]:checked');
            var q4 = document.querySelector('input[name = "q4"]:checked');
            var q5 = document.querySelector('input[name = "q5"]:checked');
            var q6 = document.querySelector('input[name = "q6"]:checked');

            if(!q1||!q2||!q3||!q4||!q5||!q6)
        {
            alert("Answer full questions !!!! ");
            return true;
        }
        else
        {
            if(q1.value=="6") score++;
            if(q2.value=="6") score++;
            if(q3.value=="6") score++;
            if(q4.value=="6") score++;
            if(q5.value=="6") score++;
            if(q6.value=="6") score++;

            alert("Score is "+score+"/6");

        }
        }
    </script>
</head>

<body bgcolor="yellow">
    <div class="qbox">
        <h1>QUIZ</h1>
        <div class="q">
            <b>
            <p class="p">1. what comes after 5 ?</p>
            <input type="radio" name="q1" id="q1" value="6">6<br>
            <input type="radio" name="q1" id="q1" value="7">7<br>
            <input type="radio" name="q1" id="q1" value="5">5<br>
            <input type="radio" name="q1" id="q1" value="4">4<br>
            </b>
        </div>
        <div class="q">
            <b>
            <p class="p">2. what comes after 5 ?</p>
            <input type="radio" name="q2" id="q2" value="6">6<br>
            <input type="radio" name="q2" id="q2" value="7">7<br>
            <input type="radio" name="q2" id="q2" value="5">5<br>
            <input type="radio" name="q2" id="q2" value="4">4<br>
            </b>
        </div>
        <div class="q">
            <b>
            <p class="p">3. what comes after 5 ?</p>
            <input type="radio" name="q3" id="q3" value="6">6<br>
            <input type="radio" name="q3" id="q3" value="7">7<br>
            <input type="radio" name="q3" id="q3" value="5">5<br>
            <input type="radio" name="q3" id="q3" value="4">4<br>
        </b></div>
        <div class="q">
            <b>
            <p class="p">4. what comes after 5 ?</p>
            <input type="radio" name="q4" id="q4" value="6">6 <br>
            <input type="radio" name="q4" id="q4" value="7">7<br>
            <input type="radio" name="q4" id="q4" value="5">5<br>
            <input type="radio" name="q4" id="q4" value="4">4<br>
        </b></div>
        <div class="q">
            <b>
            <p class="p">5. what comes after 5 ?</p>
            <input type="radio" name="q5" id="q5" value="6">6 <br>
            <input type="radio" name="q5" id="q5" value="7">7<br>
            <input type="radio" name="q5" id="q5" value="5">5<br>
            <input type="radio" name="q5" id="q5" value="4">4<br>
       </b> </div>
        <div class="q">
            <b>
            <p class="p">6. what comes after 5 ?</p>
            <input type="radio" name="q6" id="q6" value="6">6 <br>
            <input type="radio" name="q6" id="q6" value="7">7<br>
            <input type="radio" name="q6" id="q6">5<br>
            <input type="radio" name="q6" id="q6">4<br>
        </b></div>
        <button id="submit" onclick="result()">submit</button>
    </div>

    
</body>

</html>
