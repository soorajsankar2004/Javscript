<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function check()
        {
            let formatt =  /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
            let pas = document.getElementById("pass").value;
            if(formatt.test(pas))
        {
            document.write("correct password");
            return true;
        }
        else
        {
            alert("Password must contain:\n1 Uppercase\n1 Lowercase\n1 Number\n1 Special Character\nMinimum 8 characters");
            return false;
        }
        }
    </script>
</head>
<body>
    <center>
        user id : <input type="text" placeholder="Sooraj_22" ><br><br>
        password : <input type="text" id="pass">
        <br><br> <input type="button" id="btn" value="Submit" onclick="check()">
    </center>
</body>
</html>
