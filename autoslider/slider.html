<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function slide()
        {
            let list=["1.jpg","2.jpg","3.jpg","4.jpg",
                    "5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg"];
            let index=0;
            slider = setInterval(function ()
            {
                document.getElementById("imgs").src = list[index];
                index++;
                if(index == list.length)
                {
                index=0;
                }
            },1000); 
        }
        function stop()
        {
            clearInterval(slider);
        }
    </script>
</head>
<body bgcolor="black">
    <div class="slide" style="padding: 10px; border-radius: 10px; background-color: white;">
        <img id="imgs" style="border-radius: 5px; box-shadow: 5px ;" src="1.jpg" alt="Image" height="300px" width="100%">
        <center>
            <button style="font-weight: bold; 
            color: white; background-color: black;
            border-radius: 5px; font-style: unset;"
            onclick="slide()">Slide</button>
            <button style="font-weight: bold; 
            color: white; background-color: black;
            border-radius: 5px; font-style: unset; cursor: pointer;"
            onclick="stop()" >Stop</button>
        </center>
        
    </div>
    
</body>
</html>
