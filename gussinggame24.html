<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    ran =Math.floor(Math.random()*10)+1;
    function replay()
    {
    ran = Math.floor(Math.random()*10)+1;
    }
    function check()
    {
        let num = Number(document.getElementById("b").value);
    if(num==ran)
    {
        document.getElementById("c").innerHTML = "Hurray !! you got it correct";
        replay();
    }
    else if(num<ran)
    {
        document.getElementById("c").innerHTML = "Too Less  !!! number is :"+ran;
        replay();
    }
    else
    {
        document.getElementById("c").innerHTML = "Tooo High!! number is :"+ran ;
        replay();
    }
        
    }
</script>
<body>
<center>
    <h1> Guess A number and Win <br>Exiting prices </h1>
    <br>
    Guess a Number from 1 to 10 : <input id="b" type="text" style="width: 20px;">
    <button onclick="check()"> Check  </button>

    <p id="c" style="font-weight: bold; font-family: sans-serif; font-size: large;">

    </p>

    
</body>
</html>
